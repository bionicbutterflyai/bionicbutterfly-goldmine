  <rect class="b" x="20" y="282" width="330" height="56" fill="#EEF1F4" stroke="#6B7785"/><text x="185" y="302" class="t" fill="#2A2F36">GitHub · repo = MEMORY + deploy source</text><text x="185" y="320" class="s" fill="#2A2F36">feeds Netlify deploy + Claude's context</text>
  <line x1="120" y1="282" x2="120" y2="246" stroke="#888" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <rect class="b" x="372" y="282" width="326" height="56" fill="#FBE7E3" stroke="#B5462F" stroke-dasharray="5 3"/><text x="535" y="302" class="t" fill="#5A1B0F">invideo.io → FINN · marketing video</text><text x="535" y="320" class="s" fill="#5A1B0F">top-of-funnel content (separate from platform)</text>
